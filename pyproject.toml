[project]
name = "praxis"
version = "0.1.0"
description = "praxis — the reality-first loop over one roadmap: a stdlib-only CLI and a Claude Code skill."
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
praxis = "praxis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
